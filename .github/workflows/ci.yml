name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  python-security-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - name: Run Python Security Tests
        env:
          SECRET_KEY: ci-only-secret-key-with-more-than-32-characters
        run: |
          python -m pytest projects/password-auditor/tests/
          python -m pytest projects/port-scanner/tests/
          python -m pytest projects/secure-web-api/tests/
          python -m pytest projects/log-analyzer-siem/tests/
          python -m pytest projects/sast-mini/tests/
          python -m pytest projects/site-auditor/tests/

  python-machine-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - name: Run Machine Learning Tests
        run: |
          python -m pytest projects/ml-intrusion-detection/tests/
          python -m pytest projects/ml-from-scratch/tests/
          python -m pytest projects/ml-tabular-pipeline/tests/
          python -m pytest projects/ml-energy-forecasting/tests/

  rust-file-integrity-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust Integrity Monitor Tests
        run: cargo test --manifest-path projects/rust-integrity-monitor/Cargo.toml

  rust-secrets-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust Secrets Scanner Tests
        run: cargo test --manifest-path projects/rust-secrets-scanner/Cargo.toml

  csharp-auth-log-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Run C# Auth Log Analyzer Tests
        run: dotnet test projects/csharp-auth-log-analyzer/tests

  csharp-tls-inspector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Run C# TLS Inspector Tests
        run: dotnet test projects/csharp-tls-inspector/tests

  cpp-packet-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C++ Packet Parser
        run: |
          cd projects/cpp-packet-parser
          cmake -B build
          cmake --build build

  cpp-thread-pool:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitize: ["", "address", "thread"]
    steps:
      - uses: actions/checkout@v4
      - name: Build and Test C++ Thread Pool (sanitizer=${{ matrix.sanitize || 'none' }})
        run: |
          cd projects/cpp-thread-pool
          cmake -B build -DSANITIZE=${{ matrix.sanitize }}
          cmake --build build
          ctest --test-dir build --output-on-failure

  java-aes-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Run Java Vault Tests
        run: mvn test --file projects/java-aes-vault/pom.xml

  java-rate-limiter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Run Java Rate Limiter Tests
        run: mvn test --file projects/java-rate-limiter/pom.xml
        
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Secure Web API Docker Image
        run: docker build -t secure-web-api projects/secure-web-api
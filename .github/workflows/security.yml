name: Security & Supply Chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements-dev.txt

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: |
          for d in rust-integrity-monitor rust-secrets-scanner; do
            cargo generate-lockfile --manifest-path projects/$d/Cargo.toml
            cargo audit --file projects/$d/Cargo.lock
          done

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t secure-web-api:scan projects/secure-web-api
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: secure-web-api:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
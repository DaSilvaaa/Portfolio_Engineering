name: Build CV

on:
  push:
    paths:
      - "cv/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv.tex

      - name: Upload CV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: cv.pdf

      - name: Attach CV to Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.2.0 >/dev/null 2>&1 || gh release create v1.2.0 --title "v1.2.0" --notes "Ver CHANGELOG.md"
          gh release upload v1.2.0 cv.pdf --clobber